<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ages of Defense</title>
    <!-- viewport-fit=cover + user-scalable=no: on phones we want the full
         landscape area and no pinch-zoom fighting with tower placement. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0D14" />
    <!-- Added to the home screen, iOS launches this without any browser
         chrome. That is the only route to a fullscreen experience on iPhone,
         where the Fullscreen API is not implemented at all. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ages of Defense" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0d14;
        overflow: hidden;
        /* Stop the browser from scrolling / pull-to-refreshing when a finger
           drags across the board. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
