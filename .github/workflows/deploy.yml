name: Deploy to GitHub Pages

# Publishes the built game to a real, top-level URL.
#
# This exists because true fullscreen is impossible inside an embedded frame:
# the Fullscreen API is gated by a permission the embedding page has to grant,
# so on a phone the browser chrome can only be dismissed from a page the user
# navigated to directly.

on:
  push:
    branches: [claude/tower-defense-prototype-8ll55s]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the newest one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Pages serves this repo from /Tower-def-game/, so the bundle's asset
      # URLs have to be built for that prefix or every script 404s.
      - run: npm run build:pages

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it isn't already, rather than failing with a
          # "Pages not enabled" error that needs a manual settings visit.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
